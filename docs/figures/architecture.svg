<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="ar-title ar-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ar-title">Architecture and responsibilities (conceptual)</title>
  <desc id="ar-desc">People set research direction and authorize work. Dodging Infinity, a separate orchestration project, runs bounded tasks, independent review, evidence-status tracking and authorization records. This repository holds science and provenance: evidence policy, candidate inputs, model definitions, method specifications and capability records; publishing here authorizes nothing. Dodging Infinity never produces calculated energies, forces or structures. The scientific toolchain supplies computational evidence; none has been produced yet. Tools used in preparation: RDKit and ASE. Selected engine, not yet installed here: Psi4 1.11. Selected provenance system: AiiDA. Candidates evaluated from documentation only: xtb, CP2K, QCFractal, OVITO. Inputs and specifications flow from this repository to the toolchain, and raw outputs with provenance are planned to flow back.</desc>
  <defs>
    <marker id="ar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="539" rx="12" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.10"/>
  <text x="32" y="40" font-size="17" font-weight="600" fill="#0b0b0b">Architecture and responsibilities</text>
  <text x="32" y="60" font-size="12.5" fill="#52514e">Conceptual — who is responsible for what; not a deployment diagram</text>

  <!-- people -->
  <rect x="310" y="78" width="260" height="56" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="440" y="102" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">People</text>
  <text x="440" y="122" font-size="12.5" fill="#52514e" text-anchor="middle">research direction · scope · authorization</text>
  <path d="M 400 134 L 262 166" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#ar-arrow)"/>
  <text x="342" y="158" font-size="12" fill="#52514e">authorizes</text>
  <path d="M 480 134 L 618 166" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#ar-arrow)"/>
  <text x="538" y="158" font-size="12" fill="#52514e" text-anchor="end">directs</text>

  <!-- Dodging Infinity -->
  <rect x="32" y="168" width="396" height="140" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <rect x="32" y="168" width="6" height="140" rx="3" fill="#52514e"/>
  <text x="52" y="194" font-size="15" font-weight="600" fill="#0b0b0b">Dodging Infinity</text>
  <text x="52" y="212" font-size="12" fill="#52514e">orchestration and governance — separate project</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="52" y="238">• bounded task orchestration, independent review</text>
    <text x="52" y="256">• evidence-status tracking</text>
    <text x="52" y="274">• authorization and delivery records</text>
  </g>
  <text x="52" y="298" font-size="12" fill="#52514e">Never: energies, forces, structures</text>

  <path d="M 430 238 L 450 238" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#ar-arrow)" marker-start="url(#ar-arrow)"/>

  <!-- this repository -->
  <rect x="452" y="168" width="396" height="140" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="452" y="168" width="6" height="140" rx="3" fill="#2a78d6"/>
  <text x="472" y="194" font-size="15" font-weight="600" fill="#0b0b0b">di-mechanosynthesis</text>
  <text x="472" y="212" font-size="12" fill="#52514e">science and provenance — this repository</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="472" y="238">• evidence policy and claim classification</text>
    <text x="472" y="256">• candidate inputs and model definitions</text>
    <text x="472" y="274">• method specs, capability records, provenance</text>
  </g>
  <text x="472" y="298" font-size="12" fill="#52514e">Never: authorization (publishing authorizes nothing)</text>

  <!-- repo to toolchain -->
  <path d="M 580 310 L 580 348" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#ar-arrow)"/>
  <text x="572" y="334" font-size="12" fill="#52514e" text-anchor="end">inputs, specifications</text>
  <path d="M 720 348 L 720 310" stroke="#52514e" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#ar-arrow)"/>
  <text x="728" y="334" font-size="12" fill="#52514e">raw outputs (planned)</text>

  <!-- toolchain -->
  <rect x="32" y="350" width="816" height="150" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="52" y="376" font-size="15" font-weight="600" fill="#0b0b0b">Scientific toolchain</text>
  <text x="52" y="394" font-size="12" fill="#52514e">supplies computational evidence — none produced yet</text>

  <rect x="52" y="410" width="180" height="74" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="64" y="430" font-size="11.5" fill="#52514e">Used in preparation</text>
  <text x="64" y="452" font-size="14" font-weight="600" fill="#0b0b0b">RDKit · ASE</text>
  <text x="64" y="472" font-size="11.5" fill="#52514e">embeddings; structure I/O</text>

  <rect x="252" y="410" width="180" height="74" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="264" y="430" font-size="11.5" fill="#52514e">Selected engine</text>
  <text x="264" y="452" font-size="14" font-weight="600" fill="#0b0b0b">Psi4 1.11</text>
  <text x="264" y="472" font-size="11.5" fill="#52514e">not yet installed here</text>

  <rect x="452" y="410" width="180" height="74" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="464" y="430" font-size="11.5" fill="#52514e">Selected provenance</text>
  <text x="464" y="452" font-size="14" font-weight="600" fill="#0b0b0b">AiiDA</text>
  <text x="464" y="472" font-size="11.5" fill="#52514e">job execution, provenance</text>

  <rect x="652" y="410" width="180" height="74" rx="8" fill="#fcfcfb" stroke="#898781" stroke-dasharray="4 3"/>
  <text x="664" y="430" font-size="11.5" fill="#52514e">Candidates (docs only)</text>
  <text x="664" y="452" font-size="13" font-weight="600" fill="#0b0b0b">xtb · CP2K</text>
  <text x="664" y="472" font-size="13" font-weight="600" fill="#0b0b0b">QCFractal · OVITO</text>

  <text x="32" y="524" font-size="11.5" fill="#52514e">Solid border: selected or in use. Dashed border: candidate or planned. No tool is validated for chemistry here yet.</text>
</svg>
