<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-labelledby="outcomes-title outcomes-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="outcomes-title">Per-interaction target formation reported by Cowie et al. (arXiv:2605.27250v1)</title>
  <desc id="outcomes-desc">Point-and-interval chart on a 0 to 100 percent axis of the experimental per-interaction outcomes reported by the benchmark authors, not results of this project. IR-C2: 184 of 197, reported 93 percent, 95 percent confidence interval 89 to 96; 2IR-C2: 71 of 73, reported 97 percent, 95 percent confidence interval 91 to 99; IR-C2/C4: 45 of 49, reported 92 percent, 95 percent confidence interval 81 to 97; 2IR-C4: 27 of 32, reported 84 percent, 95 percent confidence interval 68 to 93.</desc>
