<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="geometry-title geometry-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="geometry-title">Fixed input geometry of job H2-A-01: two hydrogen atoms on the z axis, 1.4 bohr apart</title>
  <desc id="geometry-desc">Drawing, to scale along the z axis in bohr, of the fixed input geometry given to the engine: H1 at (0.0, 0.0, -0.7) bohr and H2 at (0.0, 0.0, 0.7) bohr, separated by 1.4 bohr. It is an input geometry that was fixed, not an optimized geometry; the separation is the fixed input internuclear distance, not an optimized or predicted equilibrium bond length. The marker size is a drawing choice, not an atomic radius.</desc>
  <rect x="0" y="0" width="720" height="292" fill="#ffffff"/>
  <text x="30" y="30" font-size="14" font-weight="bold" fill="#1f1f1f">Fixed input geometry, not optimized: H1 and H2 on the z axis</text>
  <text x="30" y="49" font-size="12" fill="#5a5a5a">x = y = 0 for both atoms. The marker size is a drawing choice, not an atomic radius.</text>
  <line x1="110.0" y1="88.0" x2="110.0" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="110.0" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-1.5</text>
  <line x1="193.3" y1="88.0" x2="193.3" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="193.3" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-1.0</text>
  <line x1="276.7" y1="88.0" x2="276.7" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="276.7" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-0.5</text>
  <line x1="360.0" y1="88.0" x2="360.0" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="360.0" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">0</text>
  <line x1="443.3" y1="88.0" x2="443.3" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="443.3" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">+0.5</text>
  <line x1="526.7" y1="88.0" x2="526.7" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="526.7" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">+1.0</text>
  <line x1="610.0" y1="88.0" x2="610.0" y2="178.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="610.0" y="194.0" font-size="12" fill="#5a5a5a" text-anchor="middle">+1.5</text>
  <line x1="110.0" y1="172.0" x2="610.0" y2="172.0" stroke="#5a5a5a" stroke-width="1"/>
  <text x="360.0" y="214.0" font-size="12.5" fill="#1f1f1f" text-anchor="middle">z coordinate (bohr)</text>
  <line x1="243.3" y1="106.0" x2="476.7" y2="106.0" stroke="#3b3b3b" stroke-width="1.6"/>
  <line x1="243.3" y1="101.0" x2="243.3" y2="111.0" stroke="#3b3b3b" stroke-width="1.6"/>
  <line x1="476.7" y1="101.0" x2="476.7" y2="111.0" stroke="#3b3b3b" stroke-width="1.6"/>
  <text x="360.0" y="97.0" font-size="13" fill="#1f1f1f" text-anchor="middle">fixed separation 1.4 bohr</text>
  <line x1="243.3" y1="111.0" x2="243.3" y2="132.0" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="243.3" cy="172.0" r="14" fill="#127c78" stroke="#ffffff" stroke-width="1.5"/>
  <text x="243.3" y="149.0" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">H1</text>
  <text x="243.3" y="236.0" font-size="12.5" fill="#1f1f1f" text-anchor="middle">z = -0.7 bohr</text>
  <text x="243.3" y="253.0" font-size="11.5" fill="#5a5a5a" text-anchor="middle">(0.0, 0.0, -0.7)</text>
  <line x1="476.7" y1="111.0" x2="476.7" y2="132.0" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="476.7" cy="172.0" r="14" fill="#127c78" stroke="#ffffff" stroke-width="1.5"/>
  <text x="476.7" y="149.0" font-size="14" font-weight="bold" fill="#1f1f1f" text-anchor="middle">H2</text>
  <text x="476.7" y="236.0" font-size="12.5" fill="#1f1f1f" text-anchor="middle">z = +0.7 bohr</text>
  <text x="476.7" y="253.0" font-size="11.5" fill="#5a5a5a" text-anchor="middle">(0.0, 0.0, 0.7)</text>
</svg>
