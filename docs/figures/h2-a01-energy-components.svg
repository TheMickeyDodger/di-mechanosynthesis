<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="components-title components-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="components-title">Signed energy components of the recorded H2-A-01 single point, in hartree</title>
  <desc id="components-desc">Three signed bars anchored at zero on one axis in hartree (Eh): nuclear repulsion Vnn +0.7142857142857143, electronic energy E_elec -1.8310000393482843 and total energy E_total -1.11671432506257, as recorded for one RHF/STO-3G calculation at a fixed separation of 1.4 bohr, with E_total = E_elec + Vnn. Vnn and E_total were reported by the engine. E_elec is the independent review's derivation, reported total minus reported nuclear repulsion, under the convention that the reported total includes the nuclear repulsion; the engine did not print it, and its bar has a dashed outline. This is a single point and not a curve.</desc>
  <rect x="0" y="0" width="720" height="386" fill="#ffffff"/>
  <text x="30" y="30" font-size="14" font-weight="bold" fill="#1f1f1f">Signed energy components of the recorded single point (hartree, Eh)</text>
  <text x="30" y="49" font-size="12" fill="#5a5a5a">One RHF/STO-3G calculation at a fixed separation of 1.4 bohr. All three bars start at zero on one axis. Signs are shown.</text>
  <line x1="224.0" y1="70.0" x2="224.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="224.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-2.0</text>
  <line x1="276.0" y1="70.0" x2="276.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="276.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-1.5</text>
  <line x1="328.0" y1="70.0" x2="328.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="328.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-1.0</text>
  <line x1="380.0" y1="70.0" x2="380.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="380.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">-0.5</text>
  <line x1="432.0" y1="70.0" x2="432.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="432.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">0</text>
  <line x1="484.0" y1="70.0" x2="484.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="484.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">+0.5</text>
  <line x1="536.0" y1="70.0" x2="536.0" y2="254.0" stroke="#e4e4e4" stroke-width="1"/>
  <text x="536.0" y="271.0" font-size="12" fill="#5a5a5a" text-anchor="middle">+1.0</text>
  <line x1="432.0" y1="70.0" x2="432.0" y2="254.0" stroke="#3b3b3b" stroke-width="1.6"/>
  <line x1="224.0" y1="254.0" x2="536.0" y2="254.0" stroke="#5a5a5a" stroke-width="1"/>
  <text x="380.0" y="291.0" font-size="12.5" fill="#1f1f1f" text-anchor="middle">Energy (hartree, Eh)</text>
  <rect x="432.0" y="98.0" width="74.3" height="28.0" fill="#127c78"/>
  <text x="204.0" y="111.0" font-size="13" fill="#1f1f1f" text-anchor="end">Nuclear repulsion, Vnn</text>
  <text x="204.0" y="125.0" font-size="11" fill="#5a5a5a" text-anchor="end">engine-reported</text>
  <text x="554.0" y="116.5" font-size="13" fill="#1f1f1f">+0.7142857142857143 Eh</text>
  <rect x="241.6" y="154.0" width="190.4" height="28.0" fill="#ffffff" stroke="#3b3b3b" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="204.0" y="167.0" font-size="13" fill="#1f1f1f" text-anchor="end">Electronic energy, E_elec</text>
  <text x="204.0" y="181.0" font-size="11" fill="#5a5a5a" text-anchor="end">independent review's derivation</text>
  <text x="554.0" y="172.5" font-size="13" fill="#1f1f1f">-1.8310000393482843 Eh</text>
  <rect x="315.9" y="210.0" width="116.1" height="28.0" fill="#127c78"/>
  <text x="204.0" y="223.0" font-size="13" fill="#1f1f1f" text-anchor="end">Total energy, E_total</text>
  <text x="204.0" y="237.0" font-size="11" fill="#5a5a5a" text-anchor="end">engine-reported</text>
  <text x="554.0" y="228.5" font-size="13" fill="#1f1f1f">-1.11671432506257 Eh</text>
  <text x="30" y="318" font-size="12.5" font-weight="bold" fill="#1f1f1f">E_total = E_elec + Vnn:   -1.11671432506257 = -1.8310000393482843 + 0.7142857142857143 Eh</text>
  <text x="30" y="338" font-size="11.5" fill="#1f1f1f">Convention (independent review, this build): the reported total includes the nuclear repulsion.</text>
  <text x="30" y="354" font-size="11.5" fill="#1f1f1f">The dashed bar is the review's derivation, E_elec = reported total - reported nuclear repulsion;</text>
  <text x="30" y="370" font-size="11.5" fill="#1f1f1f">the engine did not print it. Solid bars are values the engine reported.</text>
</svg>
