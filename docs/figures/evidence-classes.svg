<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="ev-title ev-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ev-title">Evidence classes used by this project (conceptual)</title>
  <desc id="ev-desc">Two groups of labelled boxes plus a marker. Observations and calculations: EXP, experimentally demonstrated; COMP-REPRO, computationally reproduced by this project under full provenance, none exist yet; COMP-PRED, computationally predicted. Provenance and proposals: LIT, literature-derived, a provenance label recorded with the underlying class; AGENT, agent-proposed, a plan or hypothesis and never evidence about physics; SPEC, speculative. Marker: GAP, a required input that is unavailable, which blocks every claim depending on it. A banner states that classes are never upgraded by restatement or agreement, and that language-model output is never physical evidence.</desc>

  <rect x="0.5" y="0.5" width="819" height="399" rx="12" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.10"/>
  <text x="32" y="40" font-size="17" font-weight="600" fill="#0b0b0b">How claims are classified</text>
  <text x="32" y="62" font-size="13" fill="#52514e">Conceptual diagram of the evidence policy (docs/evidence-policy.md)</text>

  <!-- group 1 -->
  <text x="32" y="98" font-size="12" font-weight="600" fill="#52514e" letter-spacing="0.5">OBSERVATIONS AND CALCULATIONS</text>
  <g>
    <rect x="32" y="110" width="236" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <rect x="32" y="110" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="52" y="136" font-size="15" font-weight="600" fill="#0b0b0b">EXP</text>
    <text x="52" y="158" font-size="12.5" fill="#52514e">Experimentally demonstrated:</text>
    <text x="52" y="176" font-size="12.5" fill="#52514e">an instrument observation</text>

    <rect x="292" y="110" width="236" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <rect x="292" y="110" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="312" y="136" font-size="15" font-weight="600" fill="#0b0b0b">COMP-REPRO</text>
    <text x="312" y="158" font-size="12.5" fill="#52514e">Reproduced by this project,</text>
    <text x="312" y="176" font-size="12.5" fill="#52514e">full provenance — none yet</text>

    <rect x="552" y="110" width="236" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <rect x="552" y="110" width="6" height="78" rx="3" fill="#2a78d6"/>
    <text x="572" y="136" font-size="15" font-weight="600" fill="#0b0b0b">COMP-PRED</text>
    <text x="572" y="158" font-size="12.5" fill="#52514e">A calculation's output,</text>
    <text x="572" y="176" font-size="12.5" fill="#52514e">presented as a prediction</text>
  </g>

  <!-- group 2 -->
  <text x="32" y="222" font-size="12" font-weight="600" fill="#52514e" letter-spacing="0.5">PROVENANCE AND PROPOSALS</text>
  <g>
    <rect x="32" y="234" width="236" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <rect x="32" y="234" width="6" height="78" rx="3" fill="#eb6834"/>
    <text x="52" y="260" font-size="15" font-weight="600" fill="#0b0b0b">LIT</text>
    <text x="52" y="282" font-size="12.5" fill="#52514e">Literature-derived: where a</text>
    <text x="52" y="300" font-size="12.5" fill="#52514e">claim came from, with locator</text>

    <rect x="292" y="234" width="236" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <rect x="292" y="234" width="6" height="78" rx="3" fill="#eb6834"/>
    <text x="312" y="260" font-size="15" font-weight="600" fill="#0b0b0b">AGENT</text>
    <text x="312" y="282" font-size="12.5" fill="#52514e">Agent-proposed: a plan or</text>
    <text x="312" y="300" font-size="12.5" fill="#52514e">hypothesis, never evidence</text>

    <rect x="552" y="234" width="236" height="78" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
    <rect x="552" y="234" width="6" height="78" rx="3" fill="#eb6834"/>
    <text x="572" y="260" font-size="15" font-weight="600" fill="#0b0b0b">SPEC</text>
    <text x="572" y="282" font-size="12.5" fill="#52514e">Speculative: offered without</text>
    <text x="572" y="300" font-size="12.5" fill="#52514e">calculation or observation</text>
  </g>

  <!-- marker and rule -->
  <rect x="32" y="330" width="236" height="44" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-dasharray="4 3"/>
  <text x="52" y="357" font-size="13" fill="#0b0b0b"><tspan font-weight="600">GAP</tspan><tspan fill="#52514e" dx="8">missing input; blocks claims</tspan></text>
  <text x="292" y="349" font-size="12.5" fill="#0b0b0b">Classes are never upgraded by restatement, summary or agreement.</text>
  <text x="292" y="368" font-size="12.5" fill="#0b0b0b">Language-model output is never physical evidence.</text>
</svg>
