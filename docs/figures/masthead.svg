<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="mh-title mh-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="mh-title">di-mechanosynthesis</title>
  <desc id="mh-desc">Masthead. An abstract probe tip descends toward a regular lattice of dots with two highlighted neighbouring sites, next to the project name and tagline. Conceptual illustration only: it is not a molecular structure, a geometry, or a result.</desc>
  <defs>
    <linearGradient id="mh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d366b"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
    <linearGradient id="mh-tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde2fb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#86b6ef" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="960" height="240" rx="16" fill="url(#mh-bg)"/>

  <!-- abstract surface lattice (conceptual) -->
  <g fill="#86b6ef" fill-opacity="0.45">
    <circle cx="560" cy="196" r="4"/><circle cx="592" cy="196" r="4"/><circle cx="624" cy="196" r="4"/><circle cx="656" cy="196" r="4"/>
    <circle cx="688" cy="196" r="4"/><circle cx="720" cy="196" r="4"/><circle cx="752" cy="196" r="4"/><circle cx="784" cy="196" r="4"/>
    <circle cx="816" cy="196" r="4"/><circle cx="848" cy="196" r="4"/><circle cx="880" cy="196" r="4"/><circle cx="912" cy="196" r="4"/>
    <circle cx="576" cy="216" r="4"/><circle cx="608" cy="216" r="4"/><circle cx="640" cy="216" r="4"/><circle cx="672" cy="216" r="4"/>
    <circle cx="704" cy="216" r="4"/><circle cx="736" cy="216" r="4"/><circle cx="768" cy="216" r="4"/><circle cx="800" cy="216" r="4"/>
    <circle cx="832" cy="216" r="4"/><circle cx="864" cy="216" r="4"/><circle cx="896" cy="216" r="4"/>
  </g>
  <!-- two highlighted sites (conceptual) -->
  <g fill="#ffffff">
    <circle cx="720" cy="196" r="5.5"/>
    <circle cx="752" cy="196" r="5.5"/>
  </g>
  <!-- abstract tip and approach path (conceptual) -->
  <path d="M 700 24 L 772 24 L 744 118 L 728 118 Z" fill="url(#mh-tip)"/>
  <circle cx="736" cy="132" r="5" fill="#ffffff"/>
  <line x1="736" y1="146" x2="736" y2="176" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
  <path d="M 730 170 L 736 180 L 742 170" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="48" y="100" font-size="44" font-weight="700" fill="#ffffff">di-mechanosynthesis</text>
  <text x="48" y="138" font-size="19" fill="#cde2fb">Provenance-first computational research on</text>
  <text x="48" y="162" font-size="19" fill="#cde2fb">mechanically controlled chemistry</text>
  <text x="48" y="212" font-size="12" fill="#b7d3f6">Conceptual illustration — not a molecular structure, geometry or result.</text>
</svg>
