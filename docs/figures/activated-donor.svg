  <title id="plate-title">Proposed activated donor candidate EAOGe-C2 radical, unoptimized input, heavy atoms only</title>
  <desc id="plate-desc">Orthographic ball-and-stick rendering of the 21 heavy atoms of the proposed activated donor candidate, drawn from the unchanged coordinates of structures/donor-activated-EAOGe-C2-radical.extxyz, an unoptimized RDKit ETKDGv3 embedding of 48 atoms. Hydrogen atoms are omitted. The germanium-substituted adamantane cage carries the C2 unit on germanium and three hydroxyethyl legs ending in oxygen atoms O1, O2 and O3. Labels map to atom IDs: Ge is D-Ge1, C-alpha is D-Ca, C-beta is D-Cb, O1 to O3 are D-O1 to D-O3. Bonds follow the atom-mapped SMILES documented in docs/donor-candidates.md. This is a proposed input, not an optimized or validated structure and not the benchmark authors' coordinates.</desc>
